# Production stack for mashuphost.tech on the Azure Ubuntu VM.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Differences from the dev docker-compose.yml, all deliberate:
#   * Postgres and Redis publish NO host ports. On a public VM the dev file's
#     "5432:5432" / "6379:6379" would expose them to the whole internet.
#   * api and web bind to 127.0.0.1 only -- Caddy is the sole public entrypoint.
#   * Credentials come from .env.production, never hardcoded here.
#   * A one-shot `migrate` service applies versioned Prisma migrations before api/worker start.
#   * Every service caps its container logs (see x-logging below).
# Docker's json-file driver has NO size limit by default. Unrotated container logs grew to
# roughly 20GB here and filled the VM's 29GB disk, which killed Postgres mid-checkpoint
# ("PANIC: could not write to file ... No space left on device") and 500ed every database-backed
# route until the logs were truncated by hand. `api` is the main producer -- it logs every
# request, and the dashboard polls /api/v1/routers every 5 seconds -- but the cap is applied to
# every service so no single one can fill the disk again. 50MB x 3 files bounds the whole stack
# at roughly 900MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Nightly database backup. The postgres_data volume was, until this service existed, the ONLY
  # copy of every tenant's customers, invoices, vouchers and encrypted router credentials — and
  # it has already been taken down once by a full disk. Uses the same postgres image so pg_dump
  # always matches the server version; a mismatch is the classic way a backup silently refuses to
  # restore. See infrastructure/backup/pg-backup.sh for the restore command.
  #
  # This protects against corruption, a bad migration and human error. It does NOT protect
  # against losing the VM, because the dumps live on that same disk: copy /backups off the host
  # (or bind-mount it to attached storage) for that.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./infrastructure/backup/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
      - postgres_backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/pg-backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env.production
    working_dir: /repo/packages/database
    # `db push` bypasses the committed migration history and can silently introduce
    # schema drift. Production must apply exactly the reviewed migrations in order.
    command: ["npx", "prisma", "db", "push", "--skip-generate", "--accept-data-loss"]
    restart: "no"
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env.production
    ports:
      - "127.0.0.1:4000:4000"
      # The worker shares this network namespace (below), so its RADIUS listeners are published
      # here. Restrict these UDP ports to known router public IPs in the Azure NSG/UFW.
      - "1812:1812/udp"
      - "1813:1813/udp"
      # The WireGuard listen port must be reachable from the public internet -- routers behind
      # CGNAT dial in, so this is the one direction that can work. Bound to 0.0.0.0 unlike the
      # API port above, and UDP. Must match WIREGUARD_LISTEN_PORT and the host firewall rule.
      - "${WIREGUARD_LISTEN_PORT:-51822}:${WIREGUARD_LISTEN_PORT:-51822}/udp"
      # Remote WinBox relay (worker, sharing this namespace): one TCP port per VPN-linked router,
      # forwarded over wg0 to the router's WinBox. Only used when ENABLE_WINBOX_RELAY=true; must
      # match WINBOX_RELAY_PORT_RANGE and be opened in the host firewall / Azure NSG.
      - "${WINBOX_RELAY_PORT_RANGE:-20000-20199}:${WINBOX_RELAY_PORT_RANGE:-20000-20199}/tcp"
    # NET_ADMIN lets this container create and configure its own wg0 (see api-entrypoint.sh).
    # This is a real privilege increase for an internet-facing service and is only meaningful
    # when ENABLE_WIREGUARD_REMOTE_ACCESS=true; with the flag off the capability is unused.
    # Deliberately NOT network_mode: host -- that would take the API off the compose network,
    # and postgres/redis publish no host ports, so it would lose both.
    cap_add:
      - NET_ADMIN
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env.production
    # Router polling and provisioning run here. Sharing the API namespace gives this process
    # access to wg0, which the API creates and owns when remote access is enabled. It also lets
    # the worker's embedded RADIUS listeners use the UDP ports published by `api` above.
    network_mode: "service:api"
    volumes:
      # The paired WhatsApp (Baileys) session keys. Without a volume these live in the
      # container filesystem and are destroyed on every rebuild, forcing a fresh QR scan
      # after each deploy. Must match WHATSAPP_AUTH_STATE_PATH in .env.production.
      - whatsapp_auth:/data/whatsapp-auth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        # Baked into the browser bundle at build time -- rebuild web if this ever changes.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env.production}
        NEXT_PUBLIC_PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:?set PLATFORM_BASE_DOMAIN in .env.production}
    restart: unless-stopped
    logging: *default-logging
    env_file: .env.production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  # Kept separate from postgres_data on purpose: a backup that shares a volume with the database
  # it is backing up is lost by the same accident that destroys the original.
  postgres_backups:
  redis_data:
  whatsapp_auth:
